.pythonchecks:
  stage: check
  image: registry.fedoraproject.org/fedora:latest
  needs: []
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  cache:
    key:
      files:
        - pyproject.toml
        - .pre-commit-config.yaml
    paths:
      - .cache/
  before_script:
    - dnf install -y git gtk4 gtksourceview5 libadwaita python3-cairo python3-gobject-base uv
    - uv venv --system-site-packages
    - uv pip install --group dev

lint:
  extends: .pythonchecks
  script:
    - uv run --no-sync pre-commit run --all-files --show-diff-on-failure

pytest:
  extends: .pythonchecks
  script:
    - uv run --no-sync pytest

build-bundle:
  stage: build
  artifacts:
    paths:
      - "meld-*.conda"
      - "meld-linux-x86_64.tar.gz"
      - "*.whl"
      - "meld-win-x86_64.zip"
  variables:
    PIXI_FROZEN: "true"
    PIXI_LOCKED: "true"
  script:
    - dnf install -y zip
    # Install pixi. 0.81.0 Is just the current latest release
    - curl -fsSL https://github.com/prefix-dev/pixi/releases/download/v0.81.0/pixi-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin pixi
    # Build the package
    - pixi publish --target-dir .
    # Build the appdir for linux-x86_64
    - pixi reinstall -e default
    - pixi run -e build python -m bundler.shrink_env .pixi/envs/default meld-*.conda meld-linux-x86_64
    # Create a .tar.bz2 from it
    - tar -czf meld-linux-x86_64.tar.gz meld-linux-x86_64
    # Create a bundle wheel
    - pixi run -e build python -m bundler.build_bundle_wheel meld-linux-x86_64 .

    # Build the appdir for win-x86_64
    - pixi reinstall -e default -p win-64
    - pixi run -e build python -m bundler.shrink_env .pixi/envs/default meld-*.conda meld-win-x86_64
    # Create a .zip from it
    - zip -qr meld-win-x86_64.zip meld-win-x86_64
    # Create a bundle wheel
    - pixi run -e build python -m bundler.build_bundle_wheel meld-win-x86_64 .

build-bundle-mac:
  stage: build
  # needs: [build-bundle]
  tags:
    - macos
    - arm64
  artifacts:
    paths:
      - "*.png"
  script:
    - mkdir -p ~/.local/bin
    - curl -fsSL https://github.com/prefix-dev/pixi/releases/download/v0.81.0/pixi-aarch64-apple-darwin.tar.gz | tar -C ~/.local/bin -xz pixi
    - export PATH=~/.local/bin:$PATH

    # XXX TODO: remove this, this is only to remove the dependency. Build the conda package.
    - pixi publish --target-dir .
    # See https://github.com/conda-forge/gtksourceview-feedstock/issues/9
    # We need a newer version of gtksourceview, since the typelib is missing in 5.18.0,
    # But currently newer versions depend on libintl, which isn't available on linux.
    # So we remove this platform temporarily.
    - pixi workspace platform remove linux-64
    - pixi update gtksourceview
    - pixi reinstall -e default
    - pixi run -e build python -m bundler.shrink_env .pixi/envs/default meld-*.conda appdir
    - MELD_SCREENSHOT_AND_EXIT=appdir-screenshot.png MELD_SCREENSHOT_TIMEOUT_MS=5000 appdir/bin/meld bundler/examples/calc_{REMOTE,BASE,LOCAL}.py
    - pixi run -e build python -m bundler.build_bundle_wheel appdir .
    - python3 -m venv venv
    - venv/bin/pip install meldmerge-*-py3-*.whl
    - MELD_SCREENSHOT_AND_EXIT=wheel-screenshot.png MELD_SCREENSHOT_TIMEOUT_MS=5000 venv/bin/meld bundler/examples/calc_{REMOTE,BASE,LOCAL}.py

test-bundle-linux:
  stage: test
  needs: [build-bundle]
  artifacts:
    paths:
      - "*.png"
  script:
    - dnf install -y xorg-x11-server-Xvfb mesa-dri-drivers dbus-daemon python
    - tar -xf meld-linux-x86_64.tar.gz
    - MELD_SCREENSHOT_AND_EXIT=appdir-screenshot.png xvfb-run -a -s "-screen 0 1920x1080x24" meld-linux-x86_64/bin/meld bundler/examples/calc_{REMOTE,BASE,LOCAL}.py
    - python -m venv venv
    - venv/bin/pip install meldmerge-*-py3-none-manylinux_2_28_x86_64.whl
    - MELD_SCREENSHOT_AND_EXIT=wheel-screenshot.png xvfb-run -a -s "-screen 0 1920x1080x24" venv/bin/meld bundler/examples/calc_{REMOTE,BASE,LOCAL}.py

test-bundle-windows:
  stage: test
  needs: [build-bundle]
  tags:
    - win32-ps
  artifacts:
    paths:
      - "*.png"
  script:
    # We use a separate script, because this seems required in order to catch all errors
    - .\bundler\test-bundle-windows.ps1
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


mingw-dist:
  stage: build
  needs: []
  variables:
    DESTDIR: install-tree
    MSYSTEM: "UCRT64"
    PKG_PREFIX: "mingw-w64-ucrt-x86_64"
    CHERE_INVOKING: "yes"
  tags: # select gitlab runners with specific tag (unrelated to git repo tags)
    - win32-ps
  artifacts:
    name: "${env:CI_JOB_STAGE}-${env:CI_COMMIT_REF_NAME}"
    paths:
      - meld-*.exe
  before_script:
    - $env:Path = "C:\msys64\${env:MSYSTEM}\bin;C:\msys64\usr\bin;${env:PATH}"
    - >
      C:\msys64\usr\bin\pacman --noconfirm -S --refresh --sysupgrade --needed
      ${env:PKG_PREFIX}-adwaita-icon-theme
      ${env:PKG_PREFIX}-appstream
      ${env:PKG_PREFIX}-desktop-file-utils
      ${env:PKG_PREFIX}-gettext
      ${env:PKG_PREFIX}-gsettings-desktop-schemas
      ${env:PKG_PREFIX}-gtk-update-icon-cache
      ${env:PKG_PREFIX}-gtk4
      ${env:PKG_PREFIX}-gtksourceview5
      ${env:PKG_PREFIX}-itstool
      ${env:PKG_PREFIX}-libadwaita
      ${env:PKG_PREFIX}-meson
      ${env:PKG_PREFIX}-nsis
      ${env:PKG_PREFIX}-pyinstaller
      ${env:PKG_PREFIX}-python-gobject
      ${env:PKG_PREFIX}-python-lxml
      ${env:PKG_PREFIX}-python-markupsafe
      ${env:PKG_PREFIX}-python-pip
      ${env:PKG_PREFIX}-python-pytest
      ${env:PKG_PREFIX}-python-pyaml
      glib2-devel
      intltool
    - pip install pyinstaller-versionfile
  script:
    - meson setup --prefix=/ . meson-build/
    - meson compile -v -C meson-build/
    - meson install -C meson-build/ --destdir=pyinstaller-build/
    # In a local environment, there is an extra msys64/ path element on the
    # end here that is missing in gitlab CI.
    - cp windows/meld.spec meson-build/pyinstaller-build
    - cd meson-build/pyinstaller-build
    - pyinstaller ./meld.spec
    - cp version.nsh dist/
    - cp ../../windows/meld.nsis dist/
    - cd dist
    - makensis ./meld.nsis
    - mv meld-*.exe ../../..
  # main purpose of this job is creating installers and not checking for breakage by changes in code
  # so allow failures since the status of the build may depend on updates of rolling-release msys2 packages
  allow_failure: true

macos:
  stage: build
  rules:
    - when: never  # This currently fails, so skip it for now
  needs: []
  tags:
    - macos
    - arm64
  cache:
    - key: ccache
      paths:
        - ccache
  variables:
    CCACHE_DIR: $CI_PROJECT_DIR/ccache
    CCACHE_MAXSIZE: "300Mi"
    PACKAGE_REGISTRY_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic
    MM_REPO_URL: https://gitlab.com/dehesselle/meld_macos.git
    MM_REPO_REF: cf0d881d2bfdc1607f0e2bd11bcd9bd215e74f1b
    MELD_BUILD: $CI_PIPELINE_IID
    REP_DIR: $CI_PROJECT_DIR
    SDKROOT: /opt/sdks/MacOSX11.3.sdk
  script:
    # Clone the repo containing all the build scripts.
    - |
      git clone $MM_REPO_URL mm
      git -C mm checkout $MM_REPO_REF
      git -C mm submodule update --recursive --init
    # Build the dependencies and then Meld. Dependencies are uploaded to the
    # package registry so they don't have to be rebuilt every time if there
    # haven't been any changes. Changes to dependencies are detected by
    # checksumming all the files and using that checksum as a version number.
    - |
      echo $CI_PROJECT_DIR > mm/ci_project_dir.txt
      MM_SHA=$(LANG=C find -s mm -type f -not -wholename '*.git/*' -exec cat {} \+ | shasum | awk '{ print $1 }')
      VER_DIR=$(mm/jhb/usr/bin/config get VER_DIR)
      PACKAGE_URL=${PACKAGE_REGISTRY_URL}/dependencies/${MM_SHA}/$(basename $VER_DIR)_$(uname -m).dmg
      if ! curl -H "JOB-TOKEN: $CI_JOB_TOKEN" -fLO $PACKAGE_URL; then
        mm/build_toolset.sh
        mm/jhb/usr/bin/jhb run rustup self uninstall -y || true
        mm/jhb/usr/bin/archive remove_nonessentials
        mm/jhb/usr/bin/archive create_dmg
        curl --fail-with-body -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file $(basename $PACKAGE_URL) $PACKAGE_URL
        rm -rf ${VER_DIR:?}
      fi
    - mm/jhb/usr/bin/archive install_dmg
    - mm/build_meld.sh
  after_script:
    - mm/jhb/usr/bin/archive uninstall_dmg
  artifacts:
    paths:
      - Meld*.dmg

.release-asset:
  stage: release
  image: registry.fedoraproject.org/fedora:latest
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/meld/${CI_COMMIT_TAG}"
    RELEASE_LINKS_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED
  script:
    - artifact=$(ls $ARTIFACT_GLOB)
    # Get rid of the pipeline ID in the filename (only affects macOS)
    - filename=$(echo "$artifact" | sed -E 's/\+[0-9]+//; s/_/-/')
    # Upload to the generic package registry, and attach to the release
    - >
      curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$artifact" "${PACKAGE_REGISTRY_URL}/${filename}"
    - |
      curl --fail-with-body --json @- "$RELEASE_LINKS_URL" --header "JOB-TOKEN: ${CI_JOB_TOKEN}" <<EOF
      {
        "name": "${LABEL}",
        "url": "${PACKAGE_REGISTRY_URL}/${filename}",
        "direct_asset_path": "/binaries/${filename}",
        "link_type": "package"
      }
      EOF

release-asset-windows:
  extends: .release-asset
  needs:
    - release-service
    - mingw-dist
  variables:
    ARTIFACT_GLOB: "meld-*.exe"
    LABEL: "Windows installer"

release-asset-macos:
  extends: .release-asset
  needs:
    - release-service
    - macos
  variables:
    ARTIFACT_GLOB: "Meld*.dmg"
    LABEL: "macOS image"
