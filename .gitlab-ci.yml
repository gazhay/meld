build-bundle:
  stage: build
  artifacts:
    paths:
      - "meld-*.conda"
      - "meld-linux-x86_64.tar.gz"
      - "*.whl"
      - "meld-win-x86_64.zip"
  variables:
    PIXI_FROZEN: "true"
    PIXI_LOCKED: "true"
  script:
    - dnf install -y zip
    # Install pixi. 0.81.0 Is just the current latest release
    - curl -fsSL https://github.com/prefix-dev/pixi/releases/download/v0.81.0/pixi-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /usr/local/bin pixi
    # Build the package
    - pixi publish --target-dir .
    # Build the appdir for linux-x86_64
    - pixi reinstall -e default
    - pixi run -e build python -m bundler.shrink_env .pixi/envs/default meld-*.conda meld-linux-x86_64
    # Create a .tar.bz2 from it
    - tar -czf meld-linux-x86_64.tar.gz meld-linux-x86_64
    # Create a bundle wheel
    - pixi run -e build python -m bundler.build_bundle_wheel meld-linux-x86_64 .

    # Build the appdir for win-x86_64
    - pixi reinstall -e default -p win-64
    - pixi run -e build python -m bundler.shrink_env .pixi/envs/default meld-*.conda meld-win-x86_64
    # Create a .zip from it
    - zip -qr meld-win-x86_64.zip meld-win-x86_64
    # Create a bundle wheel
    - pixi run -e build python -m bundler.build_bundle_wheel meld-win-x86_64 .

test-bundle-linux:
  stage: test
  needs: [build-bundle]
  artifacts:
    paths:
      - "*.png"
  variables:
    MELD_TURN_ON_HIGHLIGHT_SYNTAX: "1"
  script:
    - dnf install -y xorg-x11-server-Xvfb mesa-dri-drivers dbus-daemon python
    - tar -xf meld-linux-x86_64.tar.gz
    - MELD_SCREENSHOT_AND_EXIT=appdir-screenshot.png xvfb-run -a -s "-screen 0 1920x1080x24" meld-linux-x86_64/bin/meld bundler/examples/calc_{REMOTE,BASE,LOCAL}.py
    - python -m venv venv
    - venv/bin/pip install meldmerge-*-py3-none-manylinux_2_28_x86_64.whl
    - MELD_SCREENSHOT_AND_EXIT=wheel-screenshot.png xvfb-run -a -s "-screen 0 1920x1080x24" venv/bin/meld bundler/examples/calc_{REMOTE,BASE,LOCAL}.py

test-bundle-windows:
  stage: test
  needs: [build-bundle]
  tags:
    - win32-ps
  artifacts:
    paths:
      - "*.png"
  variables:
    MELD_TURN_ON_HIGHLIGHT_SYNTAX: "1"
  script:
    # We use a separate script, because this seems required in order to catch all errors
    - .\bundler\test-bundle-windows.ps1
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


