<svg viewBox="0 0 350 210" xmlns="http://www.w3.org/2000/svg" width="350" height="210" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "Virgil", "Segoe Print", "Comic Sans MS", "Chalkboard SE", cursive; font-size: 16px; fill: #1e1e1e; letter-spacing: 1px; }
    .node { fill: none; stroke: #1e1e1e; stroke-width: 2; }
    .blue { stroke: #1971c2; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .orange { stroke: #f08c00; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Total loop: 16s. Move 1.0s-3.5s, MERGED appears 3.7s-4.4s, hold 10s (4.4s-14.4s), fade out, restart. */
    .moving {
      animation: slide 16s infinite;
    }
    .merged {
      opacity: 0;
      animation: appear 16s infinite;
    }
    @keyframes slide {
      0%, 6.25%  { transform: translate(0px, 0px);      opacity: 1; animation-timing-function: ease-in-out; }
      21.9%      { transform: translate(-73px, -111px); opacity: 1; }
      90%        { transform: translate(-73px, -111px); opacity: 1; }
      93%        { transform: translate(-73px, -111px); opacity: 0; }
      93.1%      { transform: translate(0px, 0px);      opacity: 0; }
      99%        { transform: translate(0px, 0px);      opacity: 0; }
      100%       { transform: translate(0px, 0px);      opacity: 1; }
    }
    @keyframes appear {
      0%, 23.1%  { opacity: 0; }
      27.5%      { opacity: 1; }
      90%        { opacity: 1; }
      93%, 100%  { opacity: 0; }
    }
  </style>

  <rect width="350" height="210" fill="#ffffff"/>

  <!-- Dashed orange arrow: starts exactly on the BASE->LOCAL arrow, slides to REMOTE -->
  <g class="moving">
    <line class="orange" x1="203" y1="177" x2="233" y2="139" stroke-dasharray="6 5"/>
    <polyline class="orange" points="223.8,143 233,139 231.2,148.8"/>
  </g>

  <!-- Blue arrow BASE -> REMOTE -->
  <line class="blue" x1="191" y1="173" x2="131" y2="81"/>
  <polyline class="blue" points="132.2,94.9 131,81 143.3,87.8"/>

  <!-- Orange arrow BASE -> LOCAL (drawn on top of the dashed one) -->
  <line class="orange" x1="203" y1="177" x2="233" y2="139"/>
  <polyline class="orange" points="223.8,143 233,139 231.2,148.8"/>

  <!-- Nodes and labels -->
  <circle class="node" cx="125" cy="73" r="7"/>
  <text x="100" y="79" text-anchor="end">REMOTE</text>

  <circle class="node" cx="239" cy="132" r="7"/>
  <text x="262" y="138">LOCAL</text>

  <circle class="node" cx="198" cy="184" r="7"/>
  <text x="177" y="190" text-anchor="end">BASE</text>

  <!-- MERGED appears at the end -->
  <g class="merged">
    <circle class="node" cx="166" cy="21" r="7"/>
    <text x="186" y="27">MERGED</text>
  </g>
</svg>
